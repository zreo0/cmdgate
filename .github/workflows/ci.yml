name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - run: make check
            - run: go test -race ./...
            - run: make test-scripts

    isolation:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: make test-isolation
